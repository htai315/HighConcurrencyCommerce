name: CI & Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: hcc_test
          POSTGRES_PASSWORD: hcc_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore HighConcurrencyCommerce/HighConcurrencyCommerce.slnx

      - name: Build solution
        run: dotnet build HighConcurrencyCommerce/HighConcurrencyCommerce.slnx --no-restore --configuration Release

      - name: Run Integration Tests
        env:
          HCC_TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=hcc_test;Password=hcc_test_password
        run: dotnet test HighConcurrencyCommerce/HighConcurrencyCommerce.IntegrationTests/HighConcurrencyCommerce.IntegrationTests.csproj --no-restore --configuration Release --verbosity normal

      - name: Run T50 Catalog Search Query-Plan Gate
        env:
          HCC_PERF_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=hcc_test;Password=hcc_test_password
        run: dotnet run --project tools/HighConcurrencyCommerce.CatalogBenchmark/HighConcurrencyCommerce.CatalogBenchmark.csproj --configuration Release

  frontend:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run Oxlint (0 warnings, 0 errors)
        run: npm run lint --prefix frontend

      - name: Run Vitest Unit & Component Suite
        run: npm test --prefix frontend -- --run

      - name: Build Production Client Bundle
        run: npm run build --prefix frontend

  compose-validate:
    name: Docker Compose Config Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        env:
          POSTGRES_PASSWORD: ci_sample_secret_password_123!
          PUBLIC_WEB_URL: http://localhost:8080
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.demo.yaml config --quiet

  e2e:
    name: Playwright E2E Smoke & Commerce Journey
    runs-on: ubuntu-latest
    needs: [backend, frontend, compose-validate]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js for Playwright
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Install Playwright browsers with system dependencies
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Verify T52/T53 Playwright release flows are discoverable
        run: |
          npm run test:e2e --prefix frontend -- --list | tee playwright-discovery.txt
          grep -q "18-product-comparison.spec.ts" playwright-discovery.txt
          grep -q "19-related-recent-products.spec.ts" playwright-discovery.txt

      - name: Prepare environment file
        run: |
          cp .env.example .env
          sed -i 's/replace-with-a-long-random-password/HccLocal-2026-Only-7f3b9c2d/g' .env

      - name: Launch full Docker Compose stack
        run: docker compose -f compose.yaml -f compose.demo.yaml up -d --build

      - name: Verify versioned database migrator
        run: |
          EXIT_CODE=$(docker inspect --format='{{.State.ExitCode}}' high-concurrency-commerce-migrator-1)
          if [ "$EXIT_CODE" -ne 0 ]; then
            docker compose -f compose.yaml -f compose.demo.yaml logs migrator
            exit 1
          fi
          DB_USER=$(docker compose -f compose.yaml -f compose.demo.yaml exec -T db printenv POSTGRES_USER)
          DB_NAME=$(docker compose -f compose.yaml -f compose.demo.yaml exec -T db printenv POSTGRES_DB)
          MIGRATION_COUNT=$(docker compose -f compose.yaml -f compose.demo.yaml exec -T db \
            psql -At -U "$DB_USER" -d "$DB_NAME" -c "SELECT count(*) FROM public.schema_migrations")
          EXPECTED_MIGRATION_COUNT=$(find database -maxdepth 1 -type f -name '*.sql' ! -name '007_demo_seed.sql' | wc -l | tr -d ' ')
          test "$MIGRATION_COUNT" = "$EXPECTED_MIGRATION_COUNT"

      - name: Wait for API and Web services to become healthy
        run: |
          echo "Waiting for services..."
          READY=0
          for i in {1..30}; do
            if curl -s http://localhost:8080/health/ready | grep -q "Healthy"; then
              echo "Services are ready!"
              READY=1
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 3
          done
          if [ "$READY" -ne 1 ]; then
            echo "Error: Services timed out and failed to become ready after 90 seconds."
            docker compose -f compose.yaml -f compose.demo.yaml logs
            exit 1
          fi

      - name: Ensure demo seed data is populated
        run: docker compose -f compose.yaml -f compose.demo.yaml exec -T api dotnet HighConcurrencyCommerce.Api.dll --seed-demo

      - name: Run Playwright E2E Test Suite (Flows 1-19)
        env:
          E2E_BASE_URL: http://localhost:8080
          MAILPIT_URL: http://localhost:8025
        run: npm run test:e2e --prefix frontend

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Teardown Docker Compose stack
        if: always()
        run: docker compose -f compose.yaml -f compose.demo.yaml down -v

